<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NexusAPI — Modern REST API Dashboard with JWT authentication and role-based access control" />
  <title>NexusAPI — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="toast-container"></div>
  <div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div></div>

  <!-- AUTH VIEW -->
  <div id="auth-view" class="view">
    <div class="auth-wrapper">
      <div class="auth-bg">
        <div class="auth-bg-orb orb-1"></div>
        <div class="auth-bg-orb orb-2"></div>
        <div class="auth-bg-orb orb-3"></div>
      </div>
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="12" fill="url(#lg)"/><path d="M12 28V12h4l4 10 4-10h4v16h-3V17l-4 11h-2l-4-11v11h-3z" fill="white"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg>
          </div>
          <h1 class="auth-title">NexusAPI</h1>
          <p class="auth-subtitle">Modern API Platform · Secure & Scalable</p>
        </div>
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
          <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Sign Up</button>
          <div class="auth-tab-indicator" id="tab-indicator"></div>
        </div>
        <!-- LOGIN -->
        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="login-password" placeholder="••••••••" required minlength="6" autocomplete="current-password" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn"><span>Sign In</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
        <!-- REGISTER -->
        <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-name">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="register-name" placeholder="John Doe" required minlength="2" />
            </div>
          </div>
          <div class="form-group">
            <label for="register-email">Email Address</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="register-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>
          <div class="form-group">
            <label for="register-password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="register-password" placeholder="Min 6 chars with a number" required minlength="6" />
            </div>
          </div>
          <div class="form-group">
            <label for="register-role">Role</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <select id="register-role"><option value="user">User</option><option value="admin">Admin</option></select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="register-btn"><span>Create Account</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="view hidden">
    <nav class="navbar">
      <div class="navbar-brand">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="12" fill="url(#lg2)"/><path d="M12 28V12h4l4 10 4-10h4v16h-3V17l-4 11h-2l-4-11v11h-3z" fill="white"/><defs><linearGradient id="lg2" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg>
        <span>NexusAPI</span>
      </div>
      <div class="navbar-user">
        <div class="user-info">
          <span id="nav-user-name" class="user-name">User</span>
          <span id="nav-user-role" class="user-role-badge">user</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="handleLogout()" id="logout-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </div>
    </nav>
    <main class="dashboard-main">
      <div class="stats-row" id="stats-row">
        <div class="stat-card"><div class="stat-icon stat-icon-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div><div class="stat-info"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Total Products</span></div></div>
        <div class="stat-card"><div class="stat-icon stat-icon-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div><div class="stat-info"><span class="stat-value" id="stat-instock">0</span><span class="stat-label">In Stock</span></div></div>
        <div class="stat-card"><div class="stat-icon stat-icon-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg></div><div class="stat-info"><span class="stat-value" id="stat-categories">0</span><span class="stat-label">Categories</span></div></div>
        <div class="stat-card"><div class="stat-icon stat-icon-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div><div class="stat-info"><span class="stat-value" id="stat-recent">0</span><span class="stat-label">Added Today</span></div></div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <h2 class="section-title">Products</h2>
          <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search products..." oninput="debounceSearch()" />
          </div>
        </div>
        <div class="toolbar-right">
          <select id="filter-category" class="select-filter" onchange="loadProducts()">
            <option value="">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
            <option value="books">Books</option>
            <option value="food">Food</option>
            <option value="sports">Sports</option>
            <option value="other">Other</option>
          </select>
          <button class="btn btn-primary" onclick="openProductModal()" id="add-product-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add Product</span>
          </button>
        </div>
      </div>
      <div id="products-grid" class="products-grid"></div>
      <div id="empty-state" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <h3>No products yet</h3>
        <p>Create your first product to get started</p>
        <button class="btn btn-primary" onclick="openProductModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add Product</span></button>
      </div>
      <div id="pagination" class="pagination hidden">
        <button class="btn btn-ghost btn-sm" id="prev-page-btn" onclick="changePage(-1)" disabled>← Previous</button>
        <span id="page-info" class="page-info">Page 1 of 1</span>
        <button class="btn btn-ghost btn-sm" id="next-page-btn" onclick="changePage(1)" disabled>Next →</button>
      </div>
    </main>
  </div>

  <!-- PRODUCT MODAL -->
  <div id="product-modal" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Add Product</h3>
        <button class="btn btn-ghost btn-icon" onclick="closeProductModal()" id="close-modal-btn">✕</button>
      </div>
      <form id="product-form" onsubmit="handleProductSubmit(event)">
        <input type="hidden" id="product-id" />
        <div class="form-group"><label for="product-name">Product Name</label><input type="text" id="product-name" placeholder="e.g. Wireless Headphones" required minlength="3" maxlength="100" /></div>
        <div class="form-group"><label for="product-description">Description</label><textarea id="product-description" placeholder="Describe the product..." required maxlength="1000" rows="3"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label for="product-price">Price ($)</label><input type="number" id="product-price" placeholder="0.00" required min="0" step="0.01" /></div>
          <div class="form-group"><label for="product-category">Category</label><select id="product-category" required><option value="">Select</option><option value="electronics">Electronics</option><option value="clothing">Clothing</option><option value="books">Books</option><option value="food">Food</option><option value="sports">Sports</option><option value="other">Other</option></select></div>
        </div>
        <div class="form-group"><label class="checkbox-label"><input type="checkbox" id="product-instock" checked /><span class="checkbox-custom"></span><span>In Stock</span></label></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeProductModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="product-submit-btn"><span>Create Product</span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div id="delete-modal" class="modal-overlay hidden" onclick="closeModalOnOverlay(event)">
    <div class="modal modal-sm">
      <div class="modal-header"><h3>Delete Product</h3><button class="btn btn-ghost btn-icon" onclick="closeDeleteModal()">✕</button></div>
      <div class="modal-body">
        <div class="delete-warning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <p>Are you sure you want to delete <strong id="delete-product-name"></strong>?</p>
          <p class="text-muted">This action cannot be undone.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
